# render.yaml — Render Blueprint for Devgn Cinex Pricing
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: devgn-cinex-pricing
    runtime: docker
    region: singapore  # closest to India
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATA_DIR
        value: /data
      - key: TZ_DISPLAY
        value: Asia/Kolkata
      - key: VITE_API_URL
        value: /api
      - key: SCRAPER_CONCURRENCY
        value: "2"
      - key: FORECAST_DAYS
        value: "4"
      - key: PRICE_RETENTION_DAYS
        value: "30"
    disk:
      name: price-data
      mountPath: /data
      sizeGB: 1

